name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  control-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure-test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'opencv-python-headless>=4.10,<6' 'Pillow>=11,<13' 'pytest>=8.3,<9' 'ruff>=0.16,<1'
      - name: Lint project
        run: ruff check src tests scripts
      - name: Test control and application contracts
        env:
          PYTHONPATH: src
        run: >-
          pytest -q tests/test_interactive.py tests/test_demo_assets.py
          tests/test_control_profiles.py tests/test_control_calibration.py
          tests/test_agency.py tests/test_agency_review.py tests/test_agency_runtime.py
          tests/test_agency_coverage.py tests/test_agency_navigation_audit.py tests/test_semantic_proposals.py
          tests/test_control_benchmark_summary.py
          tests/test_scan_free_space.py tests/test_grounded_column_memory.py
          tests/test_map_improvement_audit.py
          tests/test_extended_scan_memory.py tests/test_scan_revision.py
          tests/test_dense_scan_memory.py
          tests/test_interactive_runtime.py tests/test_occluded_control.py
          tests/test_localization_recovery.py tests/test_braking_prediction.py
          tests/test_localization_audit.py tests/test_localization_loss_replay.py
          tests/test_camera.py tests/test_camera_rig.py tests/test_camera_runtime.py
          -k 'not world_rejects_invalid_rig_before_loading_scene'
      - name: Check frontend syntax
        run: |
          node --check src/bb8_rl/web/app.js
          node tests/test_web_coordinates.js
          node tests/test_web_localization.js
          node tests/test_web_agency.js
